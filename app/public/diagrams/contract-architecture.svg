<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 572" width="100%" height="100%" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#15803D"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Pure White Background -->
  <rect width="1100" height="572" fill="#FFFFFF" rx="12"/>
  <rect x="1" y="1" width="1098" height="570" fill="none" stroke="#E2E8F0" stroke-width="1.5" rx="12"/>

  <!-- TOP LAYER: Compliance & Oracle Group -->
  <text x="550" y="34" text-anchor="middle" font-size="10.5" font-weight="700" fill="#64748B" letter-spacing="0.08em">ON-CHAIN COMPLIANCE &amp; VALUATION INFRASTRUCTURE</text>

  <!-- IdentityRegistry Box (x: 165..530, width: 365, y: 48..128) -->
  <g filter="url(#card-shadow)">
    <rect x="165" y="48" width="365" height="80" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="165" y="48" width="6" height="80" rx="3" fill="#64748B"/>
    <text x="186" y="73" font-size="13.5" font-weight="700" fill="#0F172A">IdentityRegistry (ERC-3643 / T-REX)</text>
    <text x="186" y="93" font-size="11.2" fill="#475569">Verifies Borrower, Lender &amp; RepoDvP identities</text>
    <text x="186" y="112" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0F766E">isVerified(account) → bool</text>
  </g>

  <!-- nhNAVOracle Box (x: 570..935, width: 365, y: 48..128) -->
  <g filter="url(#card-shadow)">
    <rect x="570" y="48" width="365" height="80" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="570" y="48" width="6" height="80" rx="3" fill="#15803D"/>
    <text x="591" y="73" font-size="13.5" font-weight="700" fill="#0F172A">nhNAVOracle.sol</text>
    <text x="591" y="93" font-size="11.2" fill="#475569">Chainlink AggregatorV3 EUR Bond Price / NAV Feed</text>
    <text x="591" y="112" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#15803D">latestRoundData() → int256 (8 dec)</text>
  </g>

  <!-- Top-to-Middle Connectors -->
  <line x1="435" y1="128" x2="435" y2="198" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-gray)"/>
  <rect x="348" y="153" width="174" height="20" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="435" y="167" text-anchor="middle" font-size="10.5" fill="#475569">Live KYC check on proposal</text>

  <line x1="665" y1="128" x2="665" y2="198" stroke="#15803D" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <rect x="585" y="153" width="160" height="20" rx="4" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="665" y="167" text-anchor="middle" font-size="10.5" font-weight="600" fill="#166534">Live EUR NAV Pricing</text>

  <!-- MIDDLE LAYER: Borrower Desk | RepoDvP Core | Lender Desk -->

  <!-- Left: Borrower Desk (x: 30..290, width: 260, y: 218..360) -->
  <g filter="url(#card-shadow)">
    <rect x="30" y="218" width="260" height="142" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="48" y="244" font-size="10.5" font-weight="700" fill="#64748B" letter-spacing="0.06em">COUNTERPARTY A</text>
    <text x="48" y="265" font-size="15" font-weight="700" fill="#0F172A">Borrower Desk</text>
    <text x="48" y="283" font-size="11.2" fill="#475569">Cash Borrower / Bond Seller</text>
    <line x1="48" y1="295" x2="272" y2="295" stroke="#E2E8F0" stroke-width="1"/>
    <text x="48" y="313" font-size="10.2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#334155">• proposeRepo() / cancelRepo()</text>
    <text x="48" y="330" font-size="10.2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#334155">• topUpCollateral()</text>
    <text x="48" y="347" font-size="10.2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#15803D">• settleRepo() (Closing Leg)</text>
  </g>

  <!-- Horizontal Connector: Borrower -> RepoDvP -->
  <line x1="290" y1="289" x2="349" y2="289" stroke="#15803D" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <!-- Center: RepoDvP Engine (x: 355..745, width: 390, y: 204..376) -->
  <g filter="url(#card-shadow)">
    <rect x="355" y="204" width="390" height="172" rx="12" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
    <rect x="375" y="220" width="276" height="22" rx="11" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
    <text x="513" y="235" text-anchor="middle" font-size="10" font-weight="700" fill="#166534" letter-spacing="0.05em">BILATERAL REPURCHASE DvP CONTRACT</text>

    <text x="375" y="264" font-size="17" font-weight="700" fill="#0F172A">RepoDvP.sol</text>
    <text x="375" y="284" font-size="12" fill="#334155">Atomic Delivery-versus-Payment &amp; Margin Engine</text>

    <line x1="375" y1="296" x2="725" y2="296" stroke="#BBF7D0" stroke-width="1.2"/>

    <text x="375" y="316" font-size="11.2" fill="#1E293B">1. Sizes opening collateral dynamically from live NAV</text>
    <text x="375" y="334" font-size="11.2" fill="#1E293B">2. Locks nhBOND in escrow · accrues Actual/360 interest</text>
    <text x="375" y="352" font-size="11.2" fill="#1E293B">3. Enforces margin calls &amp; GMRA close-out netting</text>
  </g>

  <!-- Horizontal Connector: Lender -> RepoDvP -->
  <line x1="810" y1="289" x2="751" y2="289" stroke="#15803D" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <!-- Right: Lender Desk (x: 810..1070, width: 260, y: 218..360) -->
  <g filter="url(#card-shadow)">
    <rect x="810" y="218" width="260" height="142" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="828" y="244" font-size="10.5" font-weight="700" fill="#64748B" letter-spacing="0.06em">COUNTERPARTY B</text>
    <text x="828" y="265" font-size="15" font-weight="700" fill="#0F172A">Lender Desk</text>
    <text x="828" y="283" font-size="11.2" fill="#475569">Cash Lender / Liquidity Provider</text>
    <line x1="828" y1="295" x2="1052" y2="295" stroke="#E2E8F0" stroke-width="1"/>
    <text x="828" y="313" font-size="10.2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#15803D">• acceptRepo() (Opening DvP)</text>
    <text x="828" y="330" font-size="10.2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#334155">• marginCall() (Permissionless)</text>
    <text x="828" y="347" font-size="10.2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#334155">• claimDefault() (Net Seizure)</text>
  </g>

  <!-- Middle-to-Bottom Connectors -->
  <line x1="435" y1="382" x2="435" y2="462" stroke="#15803D" stroke-width="1.8" marker-end="url(#arrow-green)" marker-start="url(#arrow-green)"/>
  <rect x="348" y="412" width="174" height="20" rx="4" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="435" y="426" text-anchor="middle" font-size="10.5" font-weight="600" fill="#166534">Lock Collateral / Release</text>

  <line x1="665" y1="376" x2="665" y2="462" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <rect x="582" y="412" width="166" height="20" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="665" y="426" text-anchor="middle" font-size="10.5" fill="#475569">Direct Lender ↔ Borrower</text>

  <!-- BOTTOM LAYER: Permissioned Token Legs -->
  <!-- nhBOND Box (x: 165..530, width: 365, y: 468..548) -->
  <g filter="url(#card-shadow)">
    <rect x="165" y="468" width="365" height="80" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
    <rect x="165" y="468" width="6" height="80" rx="3" fill="#16A34A"/>
    <text x="186" y="493" font-size="13.5" font-weight="700" fill="#0F172A">nhBOND.sol (Collateral Leg)</text>
    <text x="186" y="512" font-size="11.2" fill="#475569">Official ERC-3643 Tokenised Sovereign Bond</text>
    <text x="186" y="531" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#166534">IdentityRegistry · ModularCompliance · AgentRole</text>
  </g>

  <!-- nhEUR Box (x: 570..935, width: 365, y: 468..548) -->
  <g filter="url(#card-shadow)">
    <rect x="570" y="468" width="365" height="80" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="570" y="468" width="6" height="80" rx="3" fill="#475569"/>
    <text x="591" y="493" font-size="13.5" font-weight="700" fill="#0F172A">nhEUR.sol (Cash Leg)</text>
    <text x="591" y="512" font-size="11.2" fill="#475569">Tokenised EUR Bank Deposit (JPM Coin Model)</text>
    <text x="591" y="531" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#334155">TREASURY_ROLE · COMPLIANCE_ROLE · ERC20Permit</text>
  </g>
</svg>
