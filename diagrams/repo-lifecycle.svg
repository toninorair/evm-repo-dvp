<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="100%" height="100%" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#15803D"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Pure White Background -->
  <rect width="1100" height="540" fill="#FFFFFF" rx="12"/>
  <rect x="1" y="1" width="1098" height="538" fill="none" stroke="#E2E8F0" stroke-width="1.5" rx="12"/>

  <!-- Top Brand & Header Bar -->
  <!-- Ethereum Institutional Logo Lockup (Top Left) -->
  <g transform="translate(36, 20)">
    <svg x="0" y="0" width="26" height="38" viewBox="100 55 200 290" fill="#0F172A">
      <circle cx="200" cy="71" r="6"/>
      <rect x="185" y="91" width="30" height="12" rx="6"/>
      <rect x="165" y="116" width="70" height="12" rx="6"/>
      <rect x="150" y="142" width="100" height="12" rx="6"/>
      <rect x="125" y="167" width="150" height="12" rx="6"/>
      <rect x="112" y="193" width="176" height="12" rx="6"/>
      <rect x="125" y="218" width="150" height="12" rx="6"/>
      <rect x="150" y="244" width="100" height="12" rx="6"/>
      <rect x="165" y="269" width="70" height="12" rx="6"/>
      <rect x="185" y="295" width="30" height="12" rx="6"/>
      <circle cx="200" cy="328" r="6"/>
    </svg>
    <text x="36" y="25" font-family="Georgia, 'Times New Roman', serif" font-size="18.5" fill="#0F172A" letter-spacing="-0.01em">Ethereum Institutional</text>
  </g>

  <!-- Center Title -->
  <text x="605" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A" letter-spacing="-0.01em">Tokenised Repo Lifecycle — Atomic DvP, Margin &amp; Close-Out Netting</text>
  <text x="605" y="61" text-anchor="middle" font-size="12.5" fill="#64748B">On-Chain State Machine: Opening DvP → Continuous Actual/360 Accrual &amp; MTM Margin → Closing RvP or Default Netting</text>
  <line x1="36" y1="78" x2="1064" y2="78" stroke="#E2E8F0" stroke-width="1"/>

  <!-- STAGE 1: Proposal & Opening Leg (Atomic DvP) -->
  <g filter="url(#card-shadow)">
    <rect x="36" y="108" width="300" height="384" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="56" y="128" width="32" height="32" rx="8" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.2"/>
    <text x="72" y="149" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">1</text>
    <text x="100" y="142" font-size="10.5" font-weight="700" fill="#15803D" letter-spacing="0.07em">OPENING LEG</text>
    <text x="100" y="158" font-size="14.5" font-weight="700" fill="#0F172A">Proposal &amp; Atomic DvP</text>

    <line x1="56" y1="176" x2="316" y2="176" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Step 1A -->
    <rect x="56" y="192" width="260" height="114" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="72" y="214" font-size="12" font-weight="700" fill="#0F172A">1a. Trade Proposal (Borrower)</text>
    <text x="72" y="233" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#15803D">proposeRepo()</text>
    <text x="72" y="252" font-size="11.5" fill="#475569">Fixes principal, repoRateBps, initial &amp;</text>
    <text x="72" y="268" font-size="11.5" fill="#475569">maintenance margin, tenor, cure window,</text>
    <text x="72" y="284" font-size="11.5" fill="#475569">and maxCollateralAmount slippage cap.</text>

    <!-- Step 1B -->
    <rect x="56" y="320" width="260" height="152" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
    <text x="72" y="342" font-size="12" font-weight="700" fill="#0F172A">1b. Acceptance &amp; Settlement (Lender)</text>
    <text x="72" y="361" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#166534">acceptRepo(repoId)</text>
    <text x="72" y="381" font-size="11.5" fill="#1E293B">• Sizes nhBOND at live nhNAVOracle price</text>
    <text x="72" y="399" font-size="11.5" fill="#1E293B">• Locks nhBOND: Borrower → RepoDvP</text>
    <text x="72" y="417" font-size="11.5" fill="#1E293B">• Settles nhEUR: Lender → Borrower</text>
    <rect x="72" y="432" width="228" height="24" rx="5" fill="#DCFCE7"/>
    <text x="186" y="448" text-anchor="middle" font-size="10.5" font-weight="600" fill="#166534">Single Tx: Both legs settle or revert</text>
  </g>

  <!-- Arrow Stage 1 -> Stage 2 -->
  <line x1="336" y1="300" x2="378" y2="300" stroke="#15803D" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <!-- STAGE 2: Term & Margin Maintenance -->
  <g filter="url(#card-shadow)">
    <rect x="382" y="108" width="300" height="384" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="402" y="128" width="32" height="32" rx="8" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.2"/>
    <text x="418" y="149" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">2</text>
    <text x="446" y="142" font-size="10.5" font-weight="700" fill="#64748B" letter-spacing="0.07em">ACTIVE TERM</text>
    <text x="446" y="158" font-size="14.5" font-weight="700" fill="#0F172A">Accrual &amp; Margining</text>

    <line x1="402" y1="176" x2="662" y2="176" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Accrual Card -->
    <rect x="402" y="192" width="260" height="96" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="418" y="214" font-size="12" font-weight="700" fill="#0F172A">Continuous Actual/360 Accrual</text>
    <text x="418" y="234" font-size="11.5" fill="#475569">Interest accrues every second elapsed:</text>
    <text x="418" y="254" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0F766E">(principal × rateBps × Δt) / 360d</text>
    <text x="418" y="272" font-size="11" fill="#64748B">Supports intraday &amp; overnight tenors</text>

    <!-- Margin Call & Cure Card -->
    <rect x="402" y="302" width="260" height="170" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="418" y="324" font-size="12" font-weight="700" fill="#0F172A">Mark-to-Market Margin Maintenance</text>
    <text x="418" y="343" font-size="11.5" fill="#475569">If NAV drop pushes collateral below</text>
    <text x="418" y="359" font-size="11.5" fill="#475569">required maintenance threshold:</text>
    <text x="418" y="381" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#334155">• marginCall(repoId)</text>
    <text x="430" y="397" font-size="11" fill="#64748B">Starts on-chain cureDeadline timer</text>
    <text x="418" y="419" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#15803D">• topUpCollateral(repoId, amount)</text>
    <text x="430" y="435" font-size="11" fill="#64748B">Borrower adds nhBOND → restores</text>
    <text x="430" y="451" font-size="11" fill="#64748B">health &amp; returns status to Active</text>
  </g>

  <!-- Branching Arrows from Stage 2 to Stage 3A and Stage 3B -->
  <path d="M 682 252 L 714 252 L 714 196 L 748 196" fill="none" stroke="#15803D" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M 682 348 L 714 348 L 714 400 L 748 400" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow-gray)"/>

  <!-- STAGE 3A: Closing Leg — Happy Path (Top Right, Sage Green) -->
  <g filter="url(#card-shadow)">
    <rect x="752" y="108" width="312" height="180" rx="10" fill="#F0FDF4" stroke="#15803D" stroke-width="1.8"/>
    <rect x="772" y="126" width="40" height="26" rx="6" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
    <text x="792" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">3A</text>
    <text x="822" y="137" font-size="10" font-weight="700" fill="#15803D" letter-spacing="0.07em">HAPPY PATH · CLOSING LEG</text>
    <text x="822" y="153" font-size="14" font-weight="700" fill="#0F172A">Atomic Receipt-vs-Payment (RvP)</text>

    <line x1="772" y1="166" x2="1044" y2="166" stroke="#BBF7D0" stroke-width="1"/>

    <text x="772" y="187" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" fill="#166534">Borrower calls settleRepo(repoId)</text>
    <text x="772" y="209" font-size="11.5" fill="#1E293B">• Repays nhEUR (Principal + Accrued Interest)</text>
    <text x="782" y="225" font-size="11.5" fill="#475569">directly from Borrower → Lender</text>
    <text x="772" y="245" font-size="11.5" fill="#1E293B">• Releases 100% of locked nhBOND back</text>
    <text x="782" y="261" font-size="11.5" fill="#475569">to Borrower atomically · emits RepoSettled</text>
  </g>

  <!-- STAGE 3B: Default Close-Out Netting (Bottom Right, Calm Slate) -->
  <g filter="url(#card-shadow)">
    <rect x="752" y="312" width="312" height="180" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.8"/>
    <rect x="772" y="330" width="40" height="26" rx="6" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
    <text x="792" y="347" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">3B</text>
    <text x="822" y="341" font-size="10" font-weight="700" fill="#64748B" letter-spacing="0.07em">DEFAULT PATH · MISSED MATURITY / CURE</text>
    <text x="822" y="357" font-size="14" font-weight="700" fill="#0F172A">GMRA Close-Out Netting</text>

    <line x1="772" y1="370" x2="1044" y2="370" stroke="#E2E8F0" stroke-width="1"/>

    <text x="772" y="391" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" fill="#334155">Lender calls claimDefault(repoId)</text>
    <text x="772" y="413" font-size="11.5" fill="#1E293B">• Sizes debt owed at live nhNAVOracle price</text>
    <text x="772" y="433" font-size="11.5" fill="#1E293B">• Seizes nhBOND equal to exact amountOwed</text>
    <text x="782" y="449" font-size="11.5" fill="#475569">and transfers to Lender</text>
    <text x="772" y="469" font-size="11.5" fill="#166534">• Returns any surplus nhBOND to Borrower</text>
  </g>
</svg>
